# sigma-llm-doc.yaml
llm:
  provider: openai          # openai, claude, or gemini
  model: gpt-4o-mini        # model name (default depends on provider)
  api_key_env: OPENAI_API_KEY  # Name of the env var holding the key

  # Enterprise / network options (uncomment as needed)
  # proxy: http://proxy.corp.example.com:8080
  # base_url: https://custom.api.example.com/v1

  # Vertex AI options (Gemini only — no API key needed)
  # vertexai: true
  # gcp_project: my-gcp-project
  # gcp_location: us-central1
  # gcp_credentials_path: /path/to/service-account.json  # or set GOOGLE_APPLICATION_CREDENTIALS

processing:
  concurrency: 5
  max_retries: 3             # Retries on validation failure
  api_max_retries: 3         # Retries on API errors (rate limit, timeout)
output:
  directory: ./output        # Default output directory
